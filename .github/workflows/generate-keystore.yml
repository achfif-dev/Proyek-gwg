name: Generate Release Keystore (jalankan SEKALI saja)

# ⚠️ SEKALI JALAN, BUKAN TIAP BUILD. Workflow ini cuma bikin file
# keystore (kunci penandatanganan) release yang baru, lalu taruh
# hasilnya (base64 + password) di:
#   1. Ringkasan run (tab Actions → run ini → "Summary")
#   2. Artifact yang bisa diunduh (zip)
#
# Setelah dapat nilainya, kamu HARUS simpan manual 4 GitHub Secrets
# lewat: repo → Settings → Secrets and variables → Actions → "New
# repository secret". Baru setelah itu workflow "Build Signed Release
# APK/AAB" bisa jalan.
#
# JANGAN jalankan workflow ini lagi kalau sudah pernah rilis ke
# pengguna — keystore baru = tanda tangan baru = HP yang sudah
# install APK versi lama tidak akan bisa di-UPDATE (harus uninstall
# dulu), Android menganggapnya aplikasi berbeda. Simpan baik-baik
# hasil dari run PERTAMA.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java (buat keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore + password acak
        id: gen
        run: |
          set -e
          STORE_PASSWORD=$(openssl rand -base64 18 | tr -dc 'A-Za-z0-9' | head -c 24)
          KEY_PASSWORD=$(openssl rand -base64 18 | tr -dc 'A-Za-z0-9' | head -c 24)
          KEY_ALIAS="gwg-superapp-release"

          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=GWG SuperApp, OU=Generasi Wangi Group, O=Generasi Wangi Group, L=Indonesia, S=Indonesia, C=ID"

          base64 -w 0 release.keystore > release.keystore.base64.txt

          {
            echo "# Hasil Generate Keystore — SIMPAN BAIK-BAIK, JANGAN DIBAGIKAN"
            echo
            echo "Tambahkan 4 secret berikut di repo → Settings → Secrets and"
            echo "variables → Actions → New repository secret (nama HARUS PERSIS sama):"
            echo
            echo "1) Nama secret : RELEASE_KEYSTORE_BASE64"
            echo "   Isi         : (lihat file release.keystore.base64.txt di artifact, copy SEMUA isinya)"
            echo
            echo "2) Nama secret : RELEASE_KEYSTORE_PASSWORD"
            echo "   Isi         : $STORE_PASSWORD"
            echo
            echo "3) Nama secret : RELEASE_KEY_ALIAS"
            echo "   Isi         : $KEY_ALIAS"
            echo
            echo "4) Nama secret : RELEASE_KEY_PASSWORD"
            echo "   Isi         : $KEY_PASSWORD"
            echo
            echo "Setelah 4 secret ini tersimpan, jalankan workflow"
            echo "\"Build Signed Release APK/AAB\" dari tab Actions."
          } > SECRET-INFO.txt

          cat SECRET-INFO.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload keystore + info secret sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-SIMPAN-BAIK-BAIK
          path: |
            release.keystore
            release.keystore.base64.txt
            SECRET-INFO.txt
          retention-days: 7
