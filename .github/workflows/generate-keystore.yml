name: Generate Release Keystore (jalankan SEKALI saja)

# ⚠️ SEKALI JALAN, BUKAN TIAP BUILD.
#
# 🔒 KEAMANAN: repo ini PUBLIK. Versi lama workflow ini mencetak password
# keystore ke "Summary" run dan mengunggah keystore sebagai artifact — keduanya
# bisa dibaca orang lain di repo publik. Versi ini TIDAK PERNAH menampilkan
# password/keystore di log, summary, maupun artifact. Kuncinya langsung
# disimpan sebagai 4 GitHub Secrets lewat GitHub CLI.
#
# PRASYARAT (sekali, bisa dari HP lewat github.com di browser):
#   1. GitHub → Settings (akun) → Developer settings → Personal access tokens
#      → Fine-grained tokens → Generate new token.
#        - Repository access : "Only select repositories" → pilih repo ini
#        - Permissions       : Repository permissions → "Secrets" = Read and write
#        - Expiration        : 7 hari sudah cukup
#   2. Repo ini → Settings → Secrets and variables → Actions → New repository
#      secret, nama: SECRETS_WRITE_TOKEN, isi: token tadi.
#   3. Jalankan workflow ini dari tab Actions. Setelah sukses, HAPUS token itu
#      dan secret SECRETS_WRITE_TOKEN (sudah tidak dibutuhkan).
#
# JANGAN jalankan lagi kalau APK sudah dipakai/dirilis — keystore baru = tanda
# tangan baru = HP yang sudah memasang APK lama tidak bisa di-UPDATE (harus
# uninstall dulu). Workflow ini menolak menimpa kalau RELEASE_KEYSTORE_BASE64
# sudah ada, kecuali "timpa" diisi "YA-TIMPA".
on:
  workflow_dispatch:
    inputs:
      timpa:
        description: 'Isi YA-TIMPA hanya jika sengaja mengganti keystore yang sudah ada'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java (buat keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pastikan token penyimpan secret tersedia
        env:
          GH_TOKEN: ${{ secrets.SECRETS_WRITE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "❌ Secret SECRETS_WRITE_TOKEN belum ada. Baca petunjuk di bagian atas file workflow ini."
            exit 1
          fi

      - name: Tolak jika keystore sudah pernah dibuat
        env:
          GH_TOKEN: ${{ secrets.SECRETS_WRITE_TOKEN }}
          TIMPA: ${{ github.event.inputs.timpa }}
        run: |
          if gh secret list --repo "$GITHUB_REPOSITORY" | grep -q '^RELEASE_KEYSTORE_BASE64'; then
            if [ "$TIMPA" != "YA-TIMPA" ]; then
              echo "❌ RELEASE_KEYSTORE_BASE64 sudah ada. Dibatalkan supaya tanda tangan APK tidak berganti."
              exit 1
            fi
            echo "⚠️ Menimpa keystore yang sudah ada (diminta eksplisit)."
          fi

      - name: Generate keystore lalu simpan langsung sebagai Secrets
        env:
          GH_TOKEN: ${{ secrets.SECRETS_WRITE_TOKEN }}
        run: |
          set -e
          set +x
          PASSWORD=$(openssl rand -base64 18 | tr -dc 'A-Za-z0-9' | head -c 24)
          echo "::add-mask::$PASSWORD"
          KEY_ALIAS="gwg-superapp-release"

          # Keystore PKCS12 memakai satu password untuk store & key.
          keytool -genkeypair \
            -keystore release.keystore \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -dname "CN=GWG SuperApp, OU=Generasi Wangi Group, O=Generasi Wangi Group, L=Indonesia, S=Indonesia, C=ID" \
            > /dev/null 2>&1

          base64 -w 0 release.keystore | gh secret set RELEASE_KEYSTORE_BASE64 --repo "$GITHUB_REPOSITORY"
          printf '%s' "$PASSWORD"  | gh secret set RELEASE_KEYSTORE_PASSWORD --repo "$GITHUB_REPOSITORY"
          printf '%s' "$KEY_ALIAS" | gh secret set RELEASE_KEY_ALIAS        --repo "$GITHUB_REPOSITORY"
          printf '%s' "$PASSWORD"  | gh secret set RELEASE_KEY_PASSWORD      --repo "$GITHUB_REPOSITORY"

          echo "✅ 4 secret release tersimpan (nilainya sengaja tidak ditampilkan)."
          echo "   Sekarang hapus token & secret SECRETS_WRITE_TOKEN, lalu jalankan workflow build release."
          echo "   ⚠️ Kunci ini TIDAK bisa diambil kembali dari GitHub. Kalau ingin cadangan, jangan"
          echo "   pakai workflow ini — unduh keystore lewat perangkat lokal yang tepercaya."
