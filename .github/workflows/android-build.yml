name: Build Android APK

# Jalan otomatis tiap push ke branch main, dan juga bisa dipicu manual
# lewat tab "Actions" di GitHub (tombol "Run workflow") tanpa perlu terminal.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Terapkan branding white-label ke project Android (dari .env)
        run: |
          set -e
          OLD_ID="com.gwg.superapp"
          APP_ID=$(grep -m1 '^VITE_APP_ID=' .env | cut -d '=' -f2- || true)
          SHORT_NAME=$(grep -m1 '^VITE_APP_SHORT_NAME=' .env | cut -d '=' -f2- || true)
          APP_ID=${APP_ID:-$OLD_ID}
          SHORT_NAME=${SHORT_NAME:-"GWG App"}

          echo "App ID target : $APP_ID"
          echo "Nama app target: $SHORT_NAME"
          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"

          # 1) capacitor.config.json
          sed -i "s/\"appId\": \"$OLD_ID\"/\"appId\": \"$APP_ID\"/" capacitor.config.json
          sed -i "s/\"appName\": \"GWG Super App\"/\"appName\": \"$SHORT_NAME\"/" capacitor.config.json

          # 2) android/app/build.gradle (namespace & applicationId)
          sed -i "s/namespace \"$OLD_ID\"/namespace \"$APP_ID\"/" android/app/build.gradle
          sed -i "s/applicationId \"$OLD_ID\"/applicationId \"$APP_ID\"/" android/app/build.gradle

          # 3) strings.xml
          STRINGS=android/app/src/main/res/values/strings.xml
          sed -i "s#<string name=\"app_name\">GWG Super App</string>#<string name=\"app_name\">$SHORT_NAME</string>#" "$STRINGS"
          sed -i "s#<string name=\"title_activity_main\">GWG Super App</string>#<string name=\"title_activity_main\">$SHORT_NAME</string>#" "$STRINGS"
          sed -i "s#<string name=\"package_name\">$OLD_ID</string>#<string name=\"package_name\">$APP_ID</string>#" "$STRINGS"
          sed -i "s#<string name=\"custom_url_scheme\">$OLD_ID</string>#<string name=\"custom_url_scheme\">$APP_ID</string>#" "$STRINGS"

          # 4) Pindahkan MainActivity.java ke folder paket baru (kalau appId berubah)
          if [ "$APP_ID" != "$OLD_ID" ]; then
            OLD_PATH="android/app/src/main/java/$(echo "$OLD_ID" | tr '.' '/')"
            NEW_PATH="android/app/src/main/java/$(echo "$APP_ID" | tr '.' '/')"
            mkdir -p "$NEW_PATH"
            mv "$OLD_PATH/MainActivity.java" "$NEW_PATH/MainActivity.java"
            sed -i "s/package $OLD_ID;/package $APP_ID;/" "$NEW_PATH/MainActivity.java"
            find android/app/src/main/java -type d -empty -delete
            echo "✅ Package Android diganti dari $OLD_ID ke $APP_ID"
          else
            echo "ℹ️ VITE_APP_ID sama dengan default GWG — tidak ada perubahan package."
          fi


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (dibutuhkan Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies npm
        run: |
          # Belum ada package-lock.json di repo → setiap run bisa menarik versi
          # dependency (firebase, @capacitor-firebase/authentication, dst) yang
          # BERBEDA dari run sebelumnya walau tidak ada kode yang diubah sama
          # sekali, karena package.json pakai rentang versi "^" bukan versi
          # persis. Ini kemungkinan besar penyebab build lama (di HP lain)
          # normal sementara build baru macet — bukan dari perubahan kode.
          # Begitu package-lock.json ada, "npm ci" dipakai supaya SETIAP run
          # ke depannya menginstal versi PERSIS yang sama, tidak drift lagi.
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Simpan package-lock.json ke repo (hanya sekali, saat pertama dibuat)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "chore: kunci versi dependency (package-lock.json) supaya build reproducible [skip ci]"
          git push || true

      - name: Build web app (Vite)
        run: npm run build

      - name: Tambahkan platform Android (Capacitor)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Sinkronkan aset web ke Android
        run: npx cap sync android

      - name: Generate ikon aplikasi dari logo GWG
        run: npx @capacitor/assets generate --android

      - name: Simpan folder android/ ke repo (hanya jika baru dibuat/berubah)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add android capacitor.config.json
          git diff --cached --quiet || git commit -m "chore: sync android/ platform files [skip ci]"
          git push || true

      - name: Build APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Jalankan app di emulator & tangkap log error
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n $APP_ID/.MainActivity
            # Sebelumnya cuma 20 detik — dari log run terakhir, WebView baru SELESAI
            # cold-start (load native library) di detik ke-18, jadi capture berhenti
            # sebelum sempat kelihatan app-nya berhasil render atau justru macet.
            # Dinaikkan supaya benar-benar mencakup hasil akhirnya.
            sleep 60
            adb logcat -d > full-log.txt
            grep -i -A 30 "FATAL EXCEPTION\|AndroidRuntime" full-log.txt > crash-log.txt || echo "Tidak ada crash terdeteksi di log" > crash-log.txt
            # Hang/macet diam (mis. koneksi Firebase tidak pernah selesai) TIDAK
            # menghasilkan FATAL EXCEPTION di atas, jadi crash-log.txt saja bisa
            # kelihatan "bersih" padahal appnya nyangkut. Saring juga baris yang
            # relevan ke jaringan/Firebase/Capacitor secara terpisah. Tag "Capacitor"
            # ditambahkan — ini kanal utama untuk log console.log/error dari JS app
            # dan status bridge Capacitor, absennya tag ini sama sekali di log
            # sebelumnya justru jadi petunjuk kalau WebView belum sempat mulai load.
            grep -i "firebase\|chromium\|CapacitorHttp\|CronetHttp\|www.googleapis\|Auth\b\|Capacitor" full-log.txt > network-log.txt || echo "Tidak ada log jaringan/Firebase yang cocok" > network-log.txt

      - name: Upload log crash sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: crash-log
          path: crash-log.txt

      - name: Upload log jaringan/Firebase sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: network-log
          path: network-log.txt

      - name: Upload log logcat LENGKAP sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-log
          path: full-log.txt

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: gwg-superapp-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
