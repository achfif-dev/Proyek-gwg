org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# R8 "full mode" (default sejak AGP 8.x) diketahui punya bug pada beberapa versi Jetpack
# Compose: bisa menyebabkan ExceptionInInitializerError/NullPointerException di static
# initializer internal Compose saat ComposeView pertama kali attach ke window (crash langsung
# begitu app dibuka, HANYA di build release/minified). Mode "compat" di bawah ini jauh lebih
# aman untuk app berbasis Compose karena optimisasi R8-nya tidak seagresif full mode.
android.enableR8.fullMode=false
